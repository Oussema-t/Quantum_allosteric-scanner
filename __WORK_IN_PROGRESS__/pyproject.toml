[project]
name = "allostery"
version = "0.2.0"
description = "Quantum allosteric scanner research package -- not published, internal use only."
requires-python = ">=3.9"
# TASK-0110/TASK-0108: no dependency manifest existed for this package
# before this task -- requirements.txt (repo root) is explicitly
# backend-only. This list is the ambient third-party import set already
# in use across src/allostery/*.py (numpy/scipy/scikit-learn/networkx/
# pyyaml/prody/matplotlib, confirmed by grepping every import statement,
# not guessed), plus `optuna`, the one genuinely new dependency this task
# adds. No version pins here (unlike requirements.txt's backend pins) --
# this package has never been pinned, and retrofitting pins for packages
# already ambiently installed and working is out of this task's scope;
# flagged, not silently done.
#
# TASK-0333: pinned, closing the gap TASK-0110 flagged above (quoted
# verbatim, not deleted -- the history of why this was unpinned is worth
# keeping). Versions are the exact ones the working research `.venv`
# already has installed (`pip freeze`, 2026-09-06), not guessed or
# upgraded -- pinning to "whatever is already known to work" rather than
# to latest, since re-validating every downstream numeric result against
# a newer scipy/sklearn is out of this task's own scope (packaging, not
# science). Full transitive closure lock: `requirements-lock.txt`
# (repo root), generated by installing this exact list into a clean venv.
dependencies = [
    "numpy==2.5.1",
    "scipy==1.18.0",
    "scikit-learn==1.9.0",
    "networkx==3.6.1",
    "pyyaml==6.0.3",
    "prody==2.6.1",
    "matplotlib==3.11.1",
    "optuna==4.9.0",
    "ripser==0.6.15",  # TASK-0142: persistent-H2 void detection, no
    # homemade Betti-number substitute permitted per that task's own hard
    # correctness constraint (Falsifier D showed a homemade single-radius
    # Rips b1 is dominated by spurious short-lived cycles).
]

[tool.pytest.ini_options]
pythonpath = ["src"]
