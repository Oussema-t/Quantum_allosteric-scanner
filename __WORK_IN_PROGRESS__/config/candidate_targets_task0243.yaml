# TASK-0243 -- 22 new untuned apo/holo pairs for the joint two-stage
# experiment with the collaborating thread. DELIBERATELY SEPARATE from
# both config/targets.yaml and config/candidate_targets_task0216.yaml --
# same reason TASK-0216 gave: no curated pocket label, no disease-
# relevance decision, provenance must stay unambiguous.
#
# Sourced via [[TASK-0215]]'s own reusable, live-RCSB, TASK-0209-VALID-
# rule-scored pipeline (`scripts/task0215_leg_b_new_proteins.py`, reused
# UNCHANGED via `scripts/task0243_curate_untuned_targets.py`), widened
# with deeper pagination + additional class-targeted query terms
# (kinase/phosphatase/protease). Every pair below cleared TASK-0209's
# own VALID rule (apo_native_hit == False AND holo_native_hit == True)
# against a druggability+overlap bar of 0.5, scored live, not assumed.
#
# **4 automated picks found wrong and EXCLUDED, not silently trusted**
# (same discipline [[TASK-0169]]'s CARDIAC_MYOSIN_TABLE1 finding
# established -- an automated table is not a citation):
#   - 4QUI (Caspase-3 F128AV266H): `classify_ligand` picked DTT
#     (dithiothreitol, a lab reducing agent, DrugBank-listed but not a
#     pharmacological drug) as "the drug" -- there is no real drug
#     ligand in this entry.
#   - 2CLK (Tryptophan Synthase, UniProt P00929): picked G3H
#     (glyceraldehyde-3-phosphate, a metabolite) over the real inhibitor
#     class already captured correctly by 2CLF/2CLH below.
#   - 4TQC / 4TPW (eIF4E, UniProt P06730): picked M7G/MGP (the mRNA
#     cap-analog cofactor bound at the ORTHOSTERIC site) over the real
#     allosteric 4EGI-1-class inhibitor also present in each entry (34J/
#     33R -- same dichlorophenyl-thiazole-hydrazine scaffold, a 1-atom
#     tiebreak lost to the cap analog under `classify_ligand`'s own
#     highest-n_atoms heuristic). Re-verified directly with the CORRECT
#     ligand: both then FAIL the VALID rule's own holo-hit prerequisite
#     (fpocket does not call the real allosteric PPI-disruption pocket
#     druggable at all) -- excluded on the rule's own terms, not
#     relabeled and kept.
# 2 exact-duplicate (protein, ligand) pairs also dropped (2CLE ligand
# F6F == 2CLF's own; 6YG2 ligand 1E8 == 6YZ4's own) -- redundant crystal
# forms of the identical complex add no real diversity.
#
# Active-site seed: verified live via `backend.active_site.
# detect_active_site(apo_pdb, chain=window_chain)` -- the SAME mechanism
# `scripts/task0242_two_stage_dryrun.py` itself calls
# (`backend_as.detect_active_site`), not `allostery.labels.
# functional_indices`'s separate func_ligand-driven path, so `func_ligand`
# is left empty throughout (not load-bearing for this experiment; see
# each entry's own `active_site_source` comment). 20/22 resolve to
# `source: uniprot` (a real curated annotation, never a top-degree
# fallback); 2 (7ZGS, 8CBS/8CBV would-be but those already show uniprot)
# resolve to `source: ligand` where noted -- still a real, structurally-
# grounded site, one tier below UniProt curation, disclosed per entry.
#
# Curation-order log (full, machine-written, append-only):
# `results/tasks/0243_curate_untuned_targets/curate_results.json`'s own
# `_curation_order` field -- proves this list was frozen (376 candidates
# screened, stopped at 28 raw valid, 22 survive the quality pass above)
# BEFORE any stage-1/ranker score was computed on any of them.

