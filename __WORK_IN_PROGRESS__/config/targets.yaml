    keep_nucleic: false
    quarantine: false
    enm_cutoff: 8.0
    pocket_contact_cutoff: 4.5
    drug_ligand: AY7
    func_ligand: ["NIL"]
    status: verified
    verified: true
    confidence: 0.90
    disease: Oncology
    target_class: Tyrosine Kinase
    site_name: Myristoyl pocket
    objective: >
      Myristoyl pocket; asciminib (ABL001) is the allosteric inhibitor.
      5MO4 holds BOTH asciminib (allosteric, myristoyl site — derive the
      pocket from this) and nilotinib (NIL, ATP-site orthosteric — EXCLUDE,
      do not predict).
    warnings:
      - "RCSB-reconfirmed 2026-07-06: 5MO4 title is 'ABL1 kinase (T334I_D382N)
         in complex with asciminib and nilotinib'; ligand table confirms
         AY7=asciminib and NIL=nilotinib both bound to chain B (auth chain
