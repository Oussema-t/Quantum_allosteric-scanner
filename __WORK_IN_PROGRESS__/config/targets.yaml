         chain to 779/780 residues (one-residue terminal offset), so this
         also fixes an unremarked apo(human)/holo(bovine) species mismatch
         that existed under 5TBY. `superpose.hamiltonians.H13_3N_anm_hessian`
         gives n_zero=6 exact rigid-body modes on 8QYP (verified directly),
         resolving TASK-0128's floppy-mode workaround for this target as a
         side effect, not by revisiting that task's own scope. `chains`
         changed to the `apo_chains`/`holo_chains` per-role override
         (TASK-0127 schema, apo='A' holo='B') since 8QYP and 8QYR use
         different author chain letters for the same biological chain.
         confidence promoted 0.65 -> 0.90, now in line with the other 3
         mandatory targets."
      - "TASK-0124, 2026-07-20: independently verified the relayed
         2026-07-20 lead proposing PDB 9GZ1 as a holo replacement for
         6C1H. Real, RCSB-confirmed: 'Beta-cardiac myosin interacting
         heads motif complexed to mavacamten', cryo-EM, 3.70 A, Homo
         sapiens, XB2 (mavacamten) present (chains J/N of a 6-chain IHM
         complex incl. light chains), McMillan et al., bioRxiv
         10.1101/2025.02.12.637875 (PMID 39990378), now published Science
         Advances 2026-04-29 (doi:10.1126/sciadv.aea9335) -- the lead's
         citation was accurate, not an error. NOT adopted as the pocket
         source: already-in-use 8QYR is higher resolution (1.80 A X-ray
         vs. 3.70 A cryo-EM) and a single motor domain rather than a
         6-chain IHM complex, making it the cleaner structure for this
         pipeline's Ca-only contact graph. Recorded here as independent
         corroboration (a second, different-species, different-method
         structure confirms the same XB2/mavacamten binding site), not a
         substitution."
    source: >
      backend/systems.py (apo/holo_validation/chain resolution) +
      SYSTEMS_allosteric_corrected_v2.md (quarantine rationale, now
      resolved — see warnings); both independently reconfirmed against
      RCSB by TASK-0003 on 2026-07-06. Apo-construct quality concern
