    site_name: Mavacamten site
    objective: >
      Mavacamten super-relaxed/IHM-stabilization site. Derive the pocket
      from XB2 (mavacamten) contacts in 8QYR, chain B — NOT from 6C1H,
      which does not contain the drug.
    warnings:
