      - "RCSB-reconfirmed 2026-07-06: 8QYR is real Bos taurus MYH7
         (beta-cardiac myosin motor domain), 1.80 A X-ray, resolution
         confirmed, nonpolymer_bound_components include XB2 (mavacamten,
         C15H19N3O2) bound to chain B (auth), plus ADP/BEF/MG/SO4/EDO.
         holo_validation_chain='B' in backend/systems.py is correct."
      - "UNRESOLVED (2026-07-06), RESOLVED 2026-07-20 (TASK-0124): apo 5TBY
         was confirmed a 20.0 A cryo-EM interacting-heads-motif (IHM)
         assembly — 6 chains (A-F), a homology model rigidly docked to a
