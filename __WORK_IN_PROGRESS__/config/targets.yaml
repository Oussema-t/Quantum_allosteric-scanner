         FIX *** placeholder (drug_ligand: ASCIMINIB, 'verify 3-letter code
         on RCSB') — AY7 is the correct, RCSB-confirmed code; backend/
         systems.py already had this right."
      - "5MO4's T334I/D382N mutation numbering is +19 vs. the literature
         T315I/D363N (334-315=19, 382-363=19) — this is exactly the ABL1
         1a/1b isoform numbering offset SYSTEMS_allosteric_corrected_v2.md
         warns about, now confirmed as a real, consistent +19 shift rather
         than a doc error. Resolve numbering before any residue-level
         mapping in labels.py/superpose.py."
    source: >
      backend/systems.py (apo/holo/chain, and the already-correct AY7 code)
      + SYSTEMS_allosteric_corrected_v2.md (func_ligand exclusion rationale,
      numbering-offset warning); both independently reconfirmed against
