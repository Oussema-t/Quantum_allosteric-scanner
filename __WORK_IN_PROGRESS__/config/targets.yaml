      - "TASK-0124, 2026-07-20: apo replaced 5TBY -> 8QYP. RCSB-verified
         directly (REST API + prody.parsePDB, live fetch, not assumed):
         8QYP is real Bos taurus MYH7 (beta-cardiac myosin motor domain),
         X-ray diffraction, 2.759 A resolution, single chain A (780
         residues, real per-residue B-factors mean=75.8/std=17.5 -- not a
         homology-model flatline), 'pre-powerstroke state' with ADP +
         vanadate (VO4, an ATP-hydrolysis transition-state mimic) at the
         nucleotide site, NOT mavacamten -- a genuine drug-free apo state
         at the allosteric (XB2) pocket. Same paper/deposition series and
         same species as the existing 8QYR holo (Auguin, Robert-Paganin,
         Rety, Kikuti, David, Theumer, Schmidt, Knolker & Houdusse,
         bioRxiv 2023, doi:10.1101/2023.11.15.567213, PMID 38014327,
