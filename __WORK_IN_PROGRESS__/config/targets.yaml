         apo-construct concern SYSTEMS_allosteric_corrected_v2.md flagged
         and it is NOT resolved by this task — confidence is held at 0.65
         (below the ~0.90-0.95 of the other 3 mandatory targets) rather
         than promoted to full verified confidence, and chains=['B'] carries
         forward backend/systems.py's choice unverified against the
         6-chain assembly's actual motor-domain mapping. TASK-0005
         (superpose.py) or TASK-0018 should re-examine before trusting the
         apo Ca graph uncritically; clean.py's own resolution check
         (>3.5A warns) will also fire on this structure."
    source: >
      backend/systems.py (apo/holo_validation/chain resolution) +
      SYSTEMS_allosteric_corrected_v2.md (quarantine rationale, now
      partially resolved — see warnings); both independently reconfirmed
      against RCSB by TASK-0003 on 2026-07-06. Apo-construct quality
      concern remains open, not resolved by this task.

