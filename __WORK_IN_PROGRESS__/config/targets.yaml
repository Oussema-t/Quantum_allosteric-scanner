schema_version: 1

# Reconciliation of SYSTEMS_allosteric_corrected_v2.md (2026-06-21) against
# backend/systems.py (production, "ported verbatim from the research
# notebook"). See .ai/tasks/DONE/TASK-0003-targets-yaml-reconciliation.md for
# the full Intent Contract and per-field decision log.
#
# Field meanings (inputs to derivation only — see the hard rule below):
#   apo_pdb / holo_pdb / holo_challenge_pdb : PDB accession codes.
#   chains            : chain letters to keep during clean() (list[str]),
#                       applied identically to both apo and holo.
#   apo_chains / holo_chains : TASK-0127 -- optional per-role override,
#                       for the rare case where the same biological chain
#                       has a different letter in the apo vs. holo
#                       deposition (e.g. GLUCOKINASE: apo chain A, holo
#                       chain X). Falls back to `chains` when absent --
#                       every target that only sets `chains` is unaffected.
#   keep_nucleic      : passed straight to clean()/clean_from_config().
#   quarantine / quarantine_reason : passed straight to clean_from_config();
#                       when quarantine is true, clean_from_config() warns.
#   enm_cutoff        : GNM/ENM contact-graph cutoff (Angstrom) — the network
#                       construction distance, NOT the pocket-contact distance.
#   pocket_contact_cutoff : the ligand-contact distance (Angstrom) labels.py
#                       must use to derive the allosteric pocket (v2's stated
#                       method: "any heavy atom within 4.5 A of the bound
#                       allosteric ligand").
#   drug_ligand       : 3-letter RCSB chemical-component ID of the allosteric
#                       ligand to derive the pocket from.
#   func_ligand       : ligand code(s)/marker(s) for the orthosteric/active
#                       site, to EXCLUDE from the derived pocket.
#   allosteric_pocket_exists : false only for targets with no folded-state
#                       pocket at all (MYC_MAX); omit otherwise.
#   status            : "verified" | "draft".
#   verified          : bool mirror of status, kept for backend/systems.py-
#                       style call sites that check a bool.
#   confidence        : confidence in the structural anchors (apo/holo/
#                       ligand/chain), NOT in any residue list — there are
#                       none here to have confidence in.
#   warnings          : free-text hazards carried from the source docs.
#   source            : which doc(s) an entry traces to, and whether this
#                       task (TASK-0003) independently re-checked it on RCSB.
#
# HARD RULE (SYSTEMS_allosteric_corrected_v2.md's central correction, carried
# forward unchanged): no hand-transcribed pocket-residue numbers go in this
# file. Every field above is metadata about *structures and ligands*, not a
# residue list. Deriving the actual pocket (by sequence-aligned Ca-to-holo-
# ligand-heavy-atom contact at pocket_contact_cutoff) is labels.py's job
# (TASK-0004), not this file's.

